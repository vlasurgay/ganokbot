#start
start.info=\u0421\u0442\u0430\u0440\u0442\u043E\u0432\u0435 \u043F\u043E\u0432\u0456\u0434\u043E\u043C\u043B\u0435\u043D\u043D\u044F \u0431\u043E\u0442\u0430.\n
start.message=\u041F\u0440\u0438\u0432\u0456\u0442! \u042F - \u043C\u043E\u0434\u0435\u0440\u0430\u0446\u0456\u0439\u043D\u0438\u0439 \u0431\u043E\u0442 \u0434\u043B\u044F \u0432\u0430\u0448\u043E\u0433\u043E \u0447\u0430\u0442\u0443. \
  \n\u0429\u043E \u044F \u0432\u043C\u0456\u044E: \
  \n- \u041A\u043E\u043D\u0442\u0440\u043E\u043B\u044C \u043D\u043E\u0432\u0438\u0445 \u0443\u0447\u0430\u0441\u043D\u0438\u043A\u0456\u0432; \
  \n- \u0417\u0430\u0445\u0438\u0441\u0442 \u0432\u0456\u0434 \u0441\u043F\u0430\u043C\u0443; \
  \n- \u0414\u043E\u043F\u043E\u043C\u0456\u0436\u043D\u0438\u0439 \u0444\u0443\u043D\u043A\u0446\u0456\u043E\u043D\u0430\u043B \u0434\u043B\u044F \u0430\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0456\u0432; \
  \n- \u0421\u0438\u0441\u0442\u0435\u043C\u0430 \u0441\u043A\u0430\u0440\u0433 \u0434\u043B\u044F \u0443\u0447\u0430\u0441\u043D\u0438\u043A\u0456\u0432. \
  \n\n\u0412\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u043E\u0432\u0443\u0439\u0442\u0435 '/help' \u0434\u043B\u044F \u043E\u0442\u0440\u0438\u043C\u0430\u043D\u043D\u044F \u0441\u043F\u0438\u0441\u043A\u0443 \u043A\u043E\u043C\u0430\u043D\u0434. \
  \n\n\u0414\u043B\u044F \u043D\u0430\u043B\u0430\u0448\u0442\u0443\u0432\u0430\u043D\u043D\u044F \u0431\u043E\u0442\u0430 \u0434\u043B\u044F \u0432\u0430\u0448\u043E\u0433\u043E \u0447\u0430\u0442\u0443 \u0434\u043E\u0434\u0430\u0439\u0442\u0435 \u0439\u043E\u0433\u043E \u044F\u043A \u0430\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0430 \
  \u0442\u0430 \u0437\u0432\u0435\u0440\u043D\u0456\u0442\u044C\u0441\u044F \u0432 \u043F\u0440\u0438\u0432\u0430\u0442\u043D\u0456 \u043F\u043E\u0432\u0456\u0434\u043E\u043C\u043B\u0435\u043D\u043D\u044F \u0434\u043E \u0431\u043E\u0442\u0430 \u0437 \u043A\u043E\u043C\u0430\u043D\u0434\u043E\u044E '/setup'. \u0423 \u0432\u0438\u043F\u0430\u0434\u043A\u0443 \
  \u0432\u0456\u0434\u0441\u0443\u0442\u043D\u043E\u0441\u0442\u0456 \u043F\u0440\u0430\u0432 \u0430\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0430, \u0431\u043E\u0442 \u043D\u0435 \u0437\u043C\u043E\u0436\u0435 \u0432\u0438\u043A\u043E\u043D\u0443\u0432\u0430\u0442\u0438 \u0441\u0432\u043E\u0457 \u0444\u0443\u043D\u043A\u0446\u0456\u0457. \
  \n\n\u042F\u043A\u0449\u043E \u043F\u0456\u0441\u043B\u044F '/setup' \u0432\u0438 \u043D\u0435 \u043C\u043E\u0436\u0435\u0442\u0435 \u0437\u043D\u0430\u0439\u0442\u0438 \u043D\u0435\u043E\u0431\u0445\u0456\u0434\u043D\u0438\u0439 \u0447\u0430\u0442 \u0434\u043B\u044F \u043D\u0430\u043B\u0430\u0448\u0442\u0443\u0432\u0430\u043D\u043D\u044F, \u0441\u043F\u0440\u043E\u0431\u0443\u0439\u0442\u0435 \
  \u043D\u0430\u0434\u0456\u0441\u043B\u0430\u0442\u0438 \u0431\u0443\u0434\u044C-\u044F\u043A\u0435 \u043F\u043E\u0432\u0456\u0434\u043E\u043C\u043B\u0435\u043D\u043D\u044F \u0432 \u043D\u0435\u043E\u0431\u0445\u0456\u0434\u043D\u0438\u0439 \u0447\u0430\u0442 \u0442\u0430 \u043F\u043E\u0432\u0442\u043E\u0440\u0438\u0442\u0438 \u043A\u043E\u043C\u0430\u043D\u0434\u0443 '/setup'.



